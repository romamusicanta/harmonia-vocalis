# Sito Caddy sulla VPS web di OVH (Strasburgo): deploy/vps.sh lo copia in
# /etc/caddy/sites/harmonia-vocalis.caddy. Tutto va al server Node del container (127.0.0.1:8404),
# pagine statiche comprese. A ogni ricostruzione il container si riavvia per qualche secondo:
# lb_try_duration fa aspettare le richieste invece di rispondere 502. I rimandi sono quelli che
# stavano in vercel.json; www e il secondo dominio harmoniavocalis.com
# rimandano alla stessa pagina di romamusicanta.org, come su Vercel.
romamusicanta.org {
	encode zstd gzip
	header Strict-Transport-Security "max-age=63072000"
	route {
		redir /stagione / 308
		@stagione path_regexp stagione ^/stagione/(.*)$
		redir @stagione /{re.stagione.1} 308
		redir /area/presenze /area/prove 308
		redir /mockup/sito/area.html /area 308
		@mockarea path_regexp mockarea ^/mockup/sito/area-([^/]+)\.html$
		redir @mockarea /area/{re.mockarea.1} 308
		redir /mockup* / 308
		reverse_proxy 127.0.0.1:8404 {
			lb_try_duration 30s
			lb_try_interval 500ms
		}
	}
}

www.romamusicanta.org, harmoniavocalis.com, www.harmoniavocalis.com {
	redir https://romamusicanta.org{uri} 308
}
